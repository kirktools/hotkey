<!doctype html><meta charset="utf-8"><button onclick="this.disabled=true;record().then(url=>{const a=document.createElement('a');a.href=url;a.download='demo.webm';a.click();this.disabled=false})">生成并下载合成演示（约 8 秒）</button><canvas width="1280" height="720"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function frame(state){ctx.fillStyle='#172438';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#f6f7f3';ctx.beginPath();ctx.roundRect(160,110,960,490,22);ctx.fill();ctx.font='32px system-ui';ctx.fillStyle='#182438';ctx.fillText('⌘ Hotkey',210,180);ctx.font='22px system-ui';ctx.fillStyle='#526077';ctx.fillText('合成数据 · 脚本驱动演示 · 非真实桌面录屏',210,230);ctx.fillStyle='#e9eef6';ctx.fillRect(205,285,870,95);ctx.font='28px system-ui';ctx.fillStyle='#182438';ctx.fillText('示例浏览器',235,345);ctx.fillStyle='#245bd7';ctx.fillText('⌥⌘ B',870,345);ctx.fillStyle='#182438';ctx.font='30px system-ui';ctx.fillText(['选择应用，录入组合键','按下 ⌘⌥B → 显示示例应用','再次按下 ⌘⌥B → 隐藏示例应用'][state],210,460);ctx.font='20px system-ui';ctx.fillStyle='#526077';ctx.fillText('打开 · 切换 · 隐藏',210,525)}frame(0);
window.record=()=>new Promise(resolve=>{let chunks=[],recorder=new MediaRecorder(canvas.captureStream(10),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:700000});recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(new Blob(chunks,{type:'video/webm'}))};recorder.start();let count=0,timer=setInterval(()=>{count++;frame(Math.min(2,Math.floor(count/25)));if(count===75){clearInterval(timer);recorder.stop()}},100)});
</script>
