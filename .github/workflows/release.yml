name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version tag
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          info = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          if os.environ['GITHUB_REF_NAME'] != 'v' + info['CFBundleShortVersionString']:
              raise SystemExit('标签与应用版本不一致')
          PY
      - name: Check and test
        run: make check test
      - name: Load fixed release certificate
        env:
          HOTKEY_RELEASE_P12_BASE64: ${{ secrets.HOTKEY_RELEASE_P12_BASE64 }}
          HOTKEY_RELEASE_P12_PASSWORD: ${{ secrets.HOTKEY_RELEASE_P12_PASSWORD }}
        run: python3 scripts/release-signing.py runner
      - name: Package
        run: make package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          output = Path('dist/packages')
          manifest = output / 'manifest.json'
          assets = [manifest, output / 'SHA256SUMS']
          metadata = json.loads(manifest.read_text())
          if metadata['signing'] != 'certificate':
              raise SystemExit('正式发布需要固定证书签名。')
          for entry in metadata['files']:
              name = entry['name']
              if Path(name).name != name or not name.startswith(('Hotkey-', 'Plugin-')) or not name.endswith(('.zip', '.dmg')):
                  raise SystemExit(f'发布附件名称无效：{name}')
              assets.append(output / name)
          if not all(asset.is_file() for asset in assets):
              raise SystemExit('发布附件缺失。')
          tag = os.environ['GITHUB_REF_NAME']
          subprocess.run(['gh', 'release', 'create', tag, *map(str, assets),
                          '--repo', os.environ['GITHUB_REPOSITORY'], '--verify-tag',
                          '--title', 'Hotkey ' + tag[1:], '--generate-notes'], check=True)
          PY
      - name: Remove release keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/hotkey-release-signing/release.keychain-db"
          if [[ -f "$keychain" ]]; then /usr/bin/security delete-keychain "$keychain"; fi

  website:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
