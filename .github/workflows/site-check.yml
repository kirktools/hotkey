name: Check website
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site.py'
      - 'Makefile'
      - '.github/workflows/*'
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make site-check
