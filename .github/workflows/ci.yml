name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make check test
      - name: Package free local release artifacts
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: Hotkey-local-build
          path: dist/packages/
