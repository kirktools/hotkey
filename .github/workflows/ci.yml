name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Build local release artifacts
        run: ./scripts/build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Hotkey-local-build
          path: dist/
